name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_PATH: ./ProductsAPI
  PUBLISH_PATH: ./myapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: Production
    
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E8949BF3B764FDFB72CAFD4AEF9CFC3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_89AE9847060F48F2AA095B8CAE57470F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F171567A82C24A3A9F4A8E98A8D9E0E7 }}
      
      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ThAmCo-ProductsAPI'
          package: deploy
