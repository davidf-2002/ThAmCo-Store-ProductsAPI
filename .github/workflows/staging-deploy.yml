name: Deploy to Staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  PROJECT_PATH: ./ProductsAPI
  PUBLISH_PATH: ./myapp

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ${{ env.PROJECT_PATH }}/ProductsAPI.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test ${{ env.PROJECT_PATH }}/ProductsAPI.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.xml"
        
      - name: Publish App
        run: dotnet publish ${{ env.PROJECT_PATH }}/ProductsAPI.csproj -c Release -o ${{ env.PUBLISH_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_test
    environment: 
        name: 'Staging'
        url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
        id-token: write #This is required for requesting the JWT
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_PATH }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E8949BF3B764FDFB72CAFD4AEF9CFC3 }}
            tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_89AE9847060F48F2AA095B8CAE57470F }}
            subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F171567A82C24A3A9F4A8E98A8D9E0E7 }}

      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v3
        with:
            app-name: 'thamco-productsapi(staging)'
            slot-name: 'staging'
            package: ${{ env.PUBLISH_PATH }}
