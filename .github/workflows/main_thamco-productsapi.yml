# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build, Test, and Deploy to Azure Web Apps

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: ./ProductsAPI
  PUBLISH_PATH: ./myapp

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build with dotnet
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release
      - name: Run unit tests
        run: dotnet test ${{ env.PROJECT_PATH }} --configuration Release --no-build --logger "trx" --results-directory ./TestResults
      - name: Store test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
      - name: dotnet publish
        run: dotnet publish ${{ env.PROJECT_PATH }}/ProductsAPI.csproj -c Release -o ${{ env.PUBLISH_PATH }}
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_PATH }}


  deploy_to_production:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download artifact from staging job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_PATH }}
      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ThAmCo-ProductsAPI'
          slot-name: 'Production'
          package: ${{ env.PUBLISH_PATH }}
