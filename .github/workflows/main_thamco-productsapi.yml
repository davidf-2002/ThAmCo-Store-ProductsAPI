# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ThAmCo-ProductsAPI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release


        # Run the unit tests
      - name: Run unit tests 
        run: dotnet test --configuration release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration release --no-build --logger trx --results-directory ./test-results

      - name: Store test results
        uses: actions/upload-artifiact@v4
        with:
          name: test-results
          path: ./test-results
        if: ${{ always() }} 


      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E8949BF3B764FDFB72CAFD4AEF9CFC3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_89AE9847060F48F2AA095B8CAE57470F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F171567A82C24A3A9F4A8E98A8D9E0E7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ThAmCo-ProductsAPI'
          slot-name: 'Production'
          package: .
          